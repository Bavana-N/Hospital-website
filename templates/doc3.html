{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Appointment – Dr. John Logan</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

  <style>

    /* Page background */
    body {
      background-color: #f0f4f8;
      font-family: 'Segoe UI', sans-serif;
    }

    /* White card style used for both sections */
    .white-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    /* Doctor photo circle */
    .doctor-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid #0d6efd;
      object-fit: cover;
    }

    /* Blue pill badge for specialty */
    .specialty-badge {
      background-color: #e8f0fe;
      color: #0d6efd;
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    /* Time slot buttons */
    .slot-btn {
      border: 1.5px solid #dee2e6;
      background: #fff;
      border-radius: 8px;
      font-size: 0.85rem;
      padding: 7px 14px;
      cursor: pointer;
    }

    /* Active / selected slot button */
    .slot-btn.selected {
      background: #0d6efd;
      color: #fff;
      border-color: #0d6efd;
    }

    /* Confirm button */
    .confirm-btn {
      background: #0d6efd;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
    }

    .confirm-btn:hover {
      background: #0b5ed7;
    }

  </style>
</head>
<body>

  <div class="container py-5" style="max-width: 520px;">

    <!-- ===== SECTION 1: Doctor Info Card ===== -->
    <div class="white-card d-flex align-items-center gap-3 mb-4">

      <!-- Doctor Photo -->
      <img src="{% static 'images/doc.webp' %}"
           class="doctor-photo" alt="Dr. John Logan" />

      <!-- Doctor Details -->
      <div>
        <h5 class="fw-bold mb-1">Dr. John Logan</h5>
        <span class="specialty-badge">
          <i class="bi bi-heart-pulse me-1"></i>Senior Orthopedic Specialist
        </span>
        <div class="mt-2 text-muted" style="font-size: 0.8rem;">
          <i class="bi bi-star-fill text-warning me-1"></i>4.9 &nbsp;·&nbsp;
          <i class="bi bi-clock me-1"></i>6+ yrs experience
        </div>
      </div>

    </div>
    <!-- ===== END Doctor Info Card ===== -->


    <!-- ===== SECTION 2: Booking Form Card ===== -->
    <div class="white-card">
      <h6 class="fw-bold mb-4">Book an Appointment</h6>

      <!-- Field 1: Select Date -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Select Date</label>
        <input type="date" id="dateInput" class="form-control" />
      </div>

      <!-- Field 2: Time Slots (clickable buttons) -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Available Time Slots</label>
        <div class="d-flex flex-wrap gap-2">
          <button class="slot-btn selected">09:00 AM</button>
          <button class="slot-btn">10:30 AM</button>
          <button class="slot-btn">12:00 PM</button>
          <button class="slot-btn">02:00 PM</button>
          <button class="slot-btn">03:30 PM</button>
          <button class="slot-btn">05:00 PM</button>
        </div>
      </div>

      <!-- Field 3: Visit Type -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Visit Type</label>
        <select class="form-select">
          <option>In-person Consultation</option>
          <option>Video Consultation</option>
        </select>
      </div>

      <!-- Field 4: Patient Name -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Patient Name</label>
        <input type="text" class="form-control" placeholder="Enter full name" />
      </div>

      <!-- Field 5: Phone Number -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Phone Number</label>
        <input type="tel" class="form-control" placeholder="+91 98765 43210" />
      </div>

      <!-- Field 6: Reason (optional) -->
      <div class="mb-4">
        <label class="form-label fw-semibold">
          Reason for Visit <span class="text-muted fw-normal">(optional)</span>
        </label>
        <textarea class="form-control" rows="2"
                  placeholder="Brief description of symptoms"></textarea>
      </div>

      <!-- Confirm Button -->
      <button class="confirm-btn">
        <i class="bi bi-calendar-check me-2"></i>Confirm Appointment
      </button>

    </div>
    <!-- ===== END Booking Form Card ===== -->

  </div>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Set today's date as default in the date input
    document.getElementById('dateInput').valueAsDate = new Date();

    // Time slot selection logic
    // Get all slot buttons
    const slotButtons = document.querySelectorAll('.slot-btn');

    // Loop through each button and add a click event
    slotButtons.forEach(function(btn) {
      btn.addEventListener('click', function() {

        // Remove 'selected' from all buttons first
        slotButtons.forEach(function(b) {
          b.classList.remove('selected');
        });

        // Add 'selected' to the button that was clicked
        btn.classList.add('selected');
      });
    });
  </script>

</body>
</html>
