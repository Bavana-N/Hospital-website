{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2B Hospital - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-info">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="{% static 'images/logo2.jpeg' %}" alt="A2B Hospital Logo" width="60" height="60"
                    class="me-2 bg-">

                <span class="fw-bold " style="font-family: Georgia, 'Times New Roman', Times, serif;">A2B
                    Hospital</span>
            </a>
        </div>
    </nav>

    <!-- Register Form -->
    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow">

                    <div class="card-header bg-info text-white text-center">
                        <h3>Patient Registration</h3>
                    </div>

                    <div class="card-body">
                        {% if messages %}
                        {% for message in messages %}
                        <div class="alert alert-info">
                            {{ message }}
                        </div>
                        {% endfor %}
                        {% endif %}
                        <!-- After Register → Login Page -->
                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="Enter Username"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" placeholder="Enter Email"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Enter Password"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" name="confirm_password" class="form-control"
                                    placeholder="Confirm Password" required>
                            </div>

                            <button type="submit" class="btn btn-info text-white w-100">
                                Register
                            </button>

                            <div class="text-center mt-3">
                                Already have an account?
                                <a href="{% url 'login' %}" class="text-decoration-none">
                                    Login
                                </a>
                            </div>
                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
