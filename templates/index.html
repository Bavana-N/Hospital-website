<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>

    <h1>Product List</h1>

    {% for product in products %}
        <div>
            <h3>{{ product.name }}</h3>

            {% if product.image %}
                <img src="{{ product.image.url }}"
                     alt="{{ product.name }}"
                     width="250">
            {% endif %}
        </div>
    {% endfor %}

</body>
</html>
